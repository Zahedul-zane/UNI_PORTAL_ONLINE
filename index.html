<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East West University Portal</title>
    <script>
        if (window.location.protocol === 'file:') {
            window.location.href = 'http://localhost:8000';
        } else {
            const token = localStorage.getItem('ewu_token');
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
            fetch('/api/me', { headers, credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.logged_in) {
                        window.location.href = `/${data.role}/dashboard.html`;
                    } else {
                        window.location.href = '/login.html';
                    }
                })
                .catch(() => {
                    window.location.href = '/login.html';
                });
        }
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: white;">
    <div style="text-align: center; max-width: 500px; padding: 20px;">
        <h2>Loading East West University Portal...</h2>
        <noscript>
            <p style="color: #ef4444;">JavaScript is required to run this application.</p>
        </noscript>
        <div id="file-protocol-warning" style="display: none; margin-top: 20px; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 8px; padding: 15px;">
            <p style="margin: 0 0 10px 0;">⚠️ It looks like you opened this file directly from your disk.</p>
            <p style="margin: 0 0 10px 0;">Please run <strong>start.bat</strong> and access the portal at:</p>
            <a href="http://localhost:8000" style="color: #38bdf8; text-decoration: underline; font-weight: bold;">http://localhost:8000</a>
        </div>
        <script>
            if (window.location.protocol === 'file:') {
                document.getElementById('file-protocol-warning').style.display = 'block';
            }
        </script>
    </div>
</body>
</html>
