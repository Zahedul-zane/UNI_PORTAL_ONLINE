<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East West University - Portal Registration</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .register-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 620px;
            border-radius: var(--radius-lg);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: neoFloatIn 0.4s ease-out;
            margin: 20px auto;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-grid-2 {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        .helper-text {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body class="login-body">

    <div class="register-card">
        <div class="login-header">
            <div class="login-brand-logo">
                <img src="/images/EWU_LOGO.png" alt="East West University Logo">
            </div>
            <h2>East West University</h2>
            <p>Academic Portal Registration &amp; Admission</p>
        </div>

        <!-- Role Tabs -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" id="tab-student" data-role="student" onclick="setRole('student')">
                🎓 Student Admission
            </button>
            <button type="button" class="role-tab" id="tab-faculty" data-role="faculty" onclick="setRole('faculty')">
                👨‍🏫 Faculty Member
            </button>
        </div>

        <div class="login-form-container" style="padding: 24px 28px 28px;">
            <div id="reg-alert" style="display:none; margin-bottom: 18px;"></div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <input type="hidden" name="selected_role" id="selected_role" value="student">

                <!-- Names (Grid) -->
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="first_name">First Name *</label>
                        <input type="text" id="first_name" name="first_name" class="form-control" placeholder="e.g. Tanvir" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" class="form-control" placeholder="e.g. Ahmed">
                    </div>
                </div>

                <!-- Email & Phone (Grid) -->
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="email">Institutional / Personal Email *</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@std.ewubd.edu" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Contact Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+880 1812 345678">
                    </div>
                </div>

                <!-- Academic Department -->
                <div class="form-group">
                    <label for="dept_id">Academic Department *</label>
                    <select id="dept_id" name="dept_id" class="form-control" required>
                        <option value="101">Computer Science &amp; Engineering (CSE)</option>
                        <option value="102">Electrical &amp; Electronic Engineering (EEE)</option>
                        <option value="103">Business Administration (BBA)</option>
                        <option value="104">Pharmacy (PHRM)</option>
                    </select>
                </div>

                <!-- Student-Only Fields -->
                <div id="student-fields">
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="student_id">Student ID (Optional)</label>
                            <input type="text" id="student_id" name="student_id" class="form-control" placeholder="Leave blank to auto-generate">
                            <div class="helper-text">💡 If left empty, official ID (e.g. 2024-3-60-625) is assigned automatically.</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">Present Residential Address</label>
                        <input type="text" id="address" name="address" class="form-control" placeholder="e.g. Aftabnagar, Rampura, Dhaka">
                    </div>
                </div>

                <!-- Faculty-Only Fields -->
                <div id="faculty-fields" style="display:none;">
                    <div class="form-grid-2">
                        <div class="form-group">
                            <label for="designation">Academic Designation</label>
                            <select id="designation" name="designation" class="form-control">
                                <option value="Lecturer">Lecturer</option>
                                <option value="Assistant Professor">Assistant Professor</option>
                                <option value="Associate Professor">Associate Professor</option>
                                <option value="Professor">Professor</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="room_no">Office / Room No</label>
                            <input type="text" id="room_no" name="room_no" class="form-control" placeholder="e.g. AB1-402">
                        </div>
                    </div>
                </div>

                <!-- Password & Confirm Password (Grid) -->
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="password">Create Password *</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password *</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" minlength="6" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="reg-btn" style="margin-top: 10px;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Complete Registration &amp; Enter Portal
                </button>
            </form>

            <!-- Back to Login Link -->
            <div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(0, 0, 0, 0.08); text-align: center;">
                <p style="margin: 0 0 8px; color: #64748b; font-size: 0.92rem;">
                    Already registered with an account?
                </p>
                <a href="/login.html" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 12px;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    Sign In to Existing Account
                </a>
            </div>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
    <script>
        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.getElementById('selected_role').value = role;

            document.getElementById('tab-student').classList.toggle('active', role === 'student');
            document.getElementById('tab-faculty').classList.toggle('active', role === 'faculty');

            const studentFields = document.getElementById('student-fields');
            const facultyFields = document.getElementById('faculty-fields');

            if (role === 'student') {
                studentFields.style.display = 'block';
                facultyFields.style.display = 'none';
                document.getElementById('email').placeholder = 'name@std.ewubd.edu';
            } else {
                studentFields.style.display = 'none';
                facultyFields.style.display = 'block';
                document.getElementById('email').placeholder = 'name@ewubd.edu';
            }
        }

        // Fetch dynamic departments list from database
        async function loadDepartments() {
            try {
                const res = await fetch('/api/departments');
                const data = await res.json();
                if (data.success && Array.isArray(data.departments) && data.departments.length > 0) {
                    const select = document.getElementById('dept_id');
                    select.innerHTML = data.departments.map(d => 
                        `<option value="${d.dept_id}">${d.dept_name}</option>`
                    ).join('');
                }
            } catch (err) {
                // Fallback options already in HTML
            }
        }
        loadDepartments();

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const alertBox = document.getElementById('reg-alert');
            alertBox.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerHTML = `<span>⚠️ Passwords do not match. Please re-enter identical passwords.</span>`;
                alertBox.style.display = 'flex';
                document.getElementById('confirm_password').focus();
                return;
            }

            const payload = {
                role: currentRole,
                first_name: document.getElementById('first_name').value.trim(),
                last_name: document.getElementById('last_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                dept_id: document.getElementById('dept_id').value,
                password: password
            };

            if (currentRole === 'student') {
                payload.dob = document.getElementById('dob').value;
                payload.student_id = document.getElementById('student_id').value.trim();
                payload.address = document.getElementById('address').value.trim();
            } else {
                payload.designation = document.getElementById('designation').value;
                payload.room_no = document.getElementById('room_no').value.trim();
            }

            btn.disabled = true;
            btn.innerHTML = 'Registering Account...';

            try {
                const res = await App.post('/register', payload);
                if (res.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerHTML = `
                        <div>
                            <strong>🎉 ${res.message || 'Registration Successful!'}</strong>
                            <div style="font-size:0.85rem; margin-top:4px;">Signing you into the portal now...</div>
                        </div>
                    `;
                    alertBox.style.display = 'flex';

                    if (res.token) {
                        localStorage.setItem('ewu_token', res.token);
                        localStorage.setItem('ewu_role', res.role);
                    }

                    setTimeout(() => {
                        window.location.href = `/${res.role}/dashboard.html`;
                    }, 1200);

                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerHTML = `<span>⚠️ ${res.error || 'Registration failed'}</span>`;
                    alertBox.style.display = 'flex';
                    btn.disabled = false;
                    btn.innerHTML = `
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Complete Registration &amp; Enter Portal
                    `;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerHTML = `<span>⚠️ ${err.message || 'Connection error. Please try again.'}</span>`;
                alertBox.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Complete Registration &amp; Enter Portal
                `;
            }
        }
    </script>
</body>
</html>
