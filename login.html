<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East West University - Portal Login</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-logo">
                <img src="/images/EWU_LOGO.png" alt="East West University Logo">
            </div>
            <h2>East West University</h2>
            <p>Integrated Portal Authentication (Node.js & Excel Engine)</p>
        </div>

        <!-- Role Tabs -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" data-role="student" onclick="setRole('student')">Student</button>
            <button type="button" class="role-tab" data-role="faculty" onclick="setRole('faculty')">Faculty</button>
            <button type="button" class="role-tab" data-role="admin" onclick="setRole('admin')">Admin</button>
        </div>

        <div class="login-form-container">
            <div id="login-alert" style="display:none; margin-bottom:15px;"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="hidden" name="selected_role" id="selected_role" value="student">

                <div class="form-group">
                    <label id="user_id_label" for="user_id">Student ID (e.g. 2023-3-60-621)</label>
                    <input type="text" name="user_id" id="user_id" class="form-control" placeholder="Enter your ID or Username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    Sign In to Portal
                </button>
            </form>

            <!-- Quick Demo Login Helpers -->
            <div class="demo-credentials-box">
                <h4>⚡ Demo Credentials (Click to Auto-fill):</h4>
                <div class="demo-chip-list">
                    <div class="demo-chip" onclick="fillDemo('student', '2023-3-60-621', 'student123')">🎓 Student: 2023-3-60-621</div>
                    <div class="demo-chip" onclick="fillDemo('faculty', '1652688915', 'faculty123')">👨‍🏫 Faculty: 1652688915</div>
                    <div class="demo-chip" onclick="fillDemo('admin', 'admin', 'admin123')">🔑 Admin: admin</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
    <script>
        if (window.location.protocol === 'file:') {
            window.location.href = 'http://localhost:8000/login.html';
        }

        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.getElementById('selected_role').value = role;
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.role === role);
            });
            const label = document.getElementById('user_id_label');
            if (role === 'student') label.innerText = 'Student ID (e.g. 2023-3-60-621)';
            else if (role === 'faculty') label.innerText = 'Faculty ID (e.g. 1652688915)';
            else label.innerText = 'Username (admin)';
        }

        function fillDemo(role, id, pass) {
            setRole(role);
            document.getElementById('user_id').value = id;
            document.getElementById('password').value = pass;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const alertBox = document.getElementById('login-alert');
            alertBox.style.display = 'none';

            const user_id = document.getElementById('user_id').value.trim();
            const password = document.getElementById('password').value;
            const selected_role = document.getElementById('selected_role').value;

            btn.disabled = true;
            btn.innerHTML = 'Signing In...';

            try {
                const res = await App.post('/login', { selected_role, user_id, password });
                if (res.success) {
                    if (res.token) {
                        localStorage.setItem('ewu_token', res.token);
                        localStorage.setItem('ewu_role', res.role);
                    }
                    window.location.href = `/${res.role}/dashboard.html`;
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerHTML = `<span>⚠️ ${res.error || 'Login failed'}</span>`;
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerHTML = `<span>⚠️ ${err.message || 'Login failed'}</span>`;
                alertBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    Sign In to Portal
                `;
            }
        }
    </script>
</body>
</html>
