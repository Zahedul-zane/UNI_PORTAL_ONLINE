<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East West University - Portal Login</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-logo">
                <img src="/images/EWU_LOGO.png" alt="East West University Logo">
            </div>
            <h2>East West University</h2>
            <p>Integrated Portal Authentication (Node.js & Excel Engine)</p>
        </div>

        <!-- Role Tabs -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" data-role="student" onclick="setRole('student')">Student</button>
            <button type="button" class="role-tab" data-role="faculty" onclick="setRole('faculty')">Faculty</button>
            <button type="button" class="role-tab" data-role="admin" onclick="setRole('admin')">Admin</button>
        </div>

        <div class="login-form-container">
            <div id="login-alert" style="display:none; margin-bottom:15px;"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="hidden" name="selected_role" id="selected_role" value="student">

                <div class="form-group">
                    <label id="user_id_label" for="user_id">Student ID or Registered Email</label>
                    <input type="text" name="user_id" id="user_id" class="form-control" placeholder="e.g. 2023-3-60-621 or name@std.ewubd.edu" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    Sign In to Portal
                </button>
            </form>

            <!-- Registration Link -->
            <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(0, 0, 0, 0.08); text-align: center;">
                <p style="margin: 0 0 10px; color: #64748b; font-size: 0.9rem;">
                    Don't have an account yet?
                </p>
                <a href="/register.html" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 12px;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                    Student & Faculty Registration
                </a>
            </div>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
    <script>
        if (window.location.protocol === 'file:') {
            window.location.href = 'http://localhost:8000/login.html';
        }

        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.getElementById('selected_role').value = role;
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.role === role);
            });
            const label = document.getElementById('user_id_label');
            const input = document.getElementById('user_id');
            if (role === 'student') {
                label.innerText = 'Student ID or Registered Email';
                input.placeholder = 'e.g. 2023-3-60-621 or name@std.ewubd.edu';
            } else if (role === 'faculty') {
                label.innerText = 'Faculty Initial / ID or Registered Email';
                input.placeholder = 'e.g. AHN, MRI or name@ewubd.edu';
            } else {
                label.innerText = 'Username or Admin Email';
                input.placeholder = 'admin or admin@ewubd.edu';
            }
        }

        // Auto-fill from query params if redirected from registration
        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');
        const emailParam = urlParams.get('email');
        if (roleParam === 'faculty' || roleParam === 'admin' || roleParam === 'student') {
            setRole(roleParam);
        }
        if (emailParam) {
            document.getElementById('user_id').value = emailParam;
            document.getElementById('password').focus();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const alertBox = document.getElementById('login-alert');
            alertBox.style.display = 'none';

            const user_id = document.getElementById('user_id').value.trim();
            const password = document.getElementById('password').value;
            const selected_role = document.getElementById('selected_role').value;

            btn.disabled = true;
            btn.innerHTML = 'Signing In...';

            try {
                const res = await App.post('/login', { selected_role, user_id, password });
                if (res.success) {
                    if (res.token) {
                        localStorage.setItem('ewu_token', res.token);
                        localStorage.setItem('ewu_role', res.role);
                    }
                    window.location.href = `/${res.role}/dashboard.html`;
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.innerHTML = `<span>⚠️ ${res.error || 'Login failed'}</span>`;
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.innerHTML = `<span>⚠️ ${err.message || 'Login failed'}</span>`;
                alertBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    Sign In to Portal
                `;
            }
        }
    </script>
</body>
</html>
