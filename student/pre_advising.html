<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Advising Requests - East West University</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="app-body">
    <div class="app-layout">
        <aside class="app-sidebar" id="app-sidebar"></aside>

        <div class="app-main">
            <header class="app-header" id="app-header"></header>

            <main class="app-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Pre-Advising Course Requests</h1>
                        <p class="page-subtitle">Submit your prospective courses for advisor review and approval.</p>
                    </div>
                </div>

                <div id="alert-container"></div>

                <!-- Submit New Pre-advising Form -->
                <div class="card" style="padding: 24px; margin-bottom: 24px;">
                    <h3 style="font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 16px;">📝 New Pre-Advising Form Submission</h3>
                    <form id="pre-adv-form" onsubmit="submitPreAdvising(event)">
                        <div style="display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap;">
                            <div class="form-group" style="flex: 1; min-width: 200px;">
                                <label>Target Semester</label>
                                <select id="target-semester" class="form-control">
                                    <option value="Summer" selected>Summer</option>
                                    <option value="Fall">Fall</option>
                                    <option value="Spring">Spring</option>
                                </select>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 200px;">
                                <label>Target Year</label>
                                <input type="number" id="target-year" class="form-control" value="2026" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Select Courses to Include:</label>
                            <div id="course-checkbox-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; max-height: 240px; overflow-y: auto; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc;">
                                <span>Loading course list...</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submit-pa-btn">
                            Submit Pre-Advising Request
                        </button>
                    </form>
                </div>

                <!-- Submitted Forms History -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Submitted Pre-Advising Forms & Approval Status</h3>
                    </div>
                    <div class="card-body" id="pa-history-container" style="padding: 20px;">
                        <p style="color: #94a3b8;">Loading history...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
    <script>
        let availableCourses = [];

        async function loadPreAdvising() {
            const authOk = await App.requireAuth('student');
            if (!authOk) return;

            const data = await App.get('/student/pre-advising');
            availableCourses = data.available_courses || [];

            // Render course checkboxes
            const cbList = document.getElementById('course-checkbox-list');
            if (availableCourses.length > 0) {
                cbList.innerHTML = availableCourses.map(c => `
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem; background: #ffffff; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer;">
                        <input type="checkbox" name="selected_course" value="${c.course_id}">
                        <div>
                            <strong>${App.escape(c.course_id)}</strong> - ${App.escape(c.course_title)}
                            <span style="color:#64748b; font-size:0.75rem;">(${c.credits} Cr)</span>
                        </div>
                    </label>
                `).join('');
            }

            // Render history
            const histContainer = document.getElementById('pa-history-container');
            const requests = data.requests || [];
            if (requests.length > 0) {
                histContainer.innerHTML = requests.map(req => `
                    <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #ffffff;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <h4 style="margin:0; font-size:1rem; color:#0f172a;">Form #${req.pre_advising_id} • ${App.escape(req.semester)} ${req.year}</h4>
                            <span style="font-size:0.8rem; color:#64748b;">Submitted: ${App.escape(req.timestamp)}</span>
                        </div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Course Code</th>
                                    <th>Course Title</th>
                                    <th>Credits</th>
                                    <th>Advisor Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(req.courses || []).map(c => `
                                    <tr>
                                        <td><strong>${App.escape(c.course_id)}</strong></td>
                                        <td>${App.escape(c.course_title || '')}</td>
                                        <td>${c.credits || 3.0}</td>
                                        <td>
                                            <span class="badge badge-${c.status === 'Approved' ? 'success' : (c.status === 'Rejected' ? 'danger' : 'warning')}">
                                                ${App.escape(c.status)}
                                            </span>
                                        </td>
                                        <td>
                                            ${c.status === 'Approved' ? '<a href="/student/advising.html" class="btn btn-primary btn-sm">Take Section</a>' : '<span style="color:#94a3b8; font-size:0.8rem;">Pending Approval</span>'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `).join('');
            } else {
                histContainer.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 20px;">No pre-advising forms submitted yet.</p>`;
            }
        }

        async function submitPreAdvising(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-pa-btn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            const checkboxes = document.querySelectorAll('input[name="selected_course"]:checked');
            const selected = Array.from(checkboxes).map(cb => cb.value);

            if (selected.length === 0) {
                App.showAlert('Please select at least one course.', 'danger');
                btn.disabled = false;
                btn.innerText = 'Submit Pre-Advising Request';
                return;
            }

            const semester = document.getElementById('target-semester').value;
            const year = parseInt(document.getElementById('target-year').value);

            try {
                const res = await App.post('/student/pre-advising', {
                    semester,
                    year,
                    courses: selected
                });
                App.showAlert(res.message || 'Pre-advising request submitted!', 'success');
                loadPreAdvising();
            } catch (err) {
                App.showAlert(err.message || 'Submission failed.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit Pre-Advising Request';
            }
        }

        document.addEventListener('DOMContentLoaded', loadPreAdvising);
    </script>
</body>
</html>
